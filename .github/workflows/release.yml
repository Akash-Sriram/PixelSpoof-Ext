name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.keystore
          fi
        shell: bash

      - name: Build APKs
        run: |
          if [ -f release.keystore ]; then
            export RELEASE_STORE_FILE="release.keystore"
            export RELEASE_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}"
            export RELEASE_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
            export RELEASE_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"
          fi
          ./gradlew assembleDebug assembleRelease
        shell: bash

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PixelSpoof-Ext-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PixelSpoof-Ext-release.apk
          else
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/PixelSpoof-Ext-release-unsigned.apk
          fi
        shell: bash

      - name: Get Tag Name
        id: tag_name
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.tag_name.outputs.tag }}"
          files: |
            app/build/outputs/apk/debug/PixelSpoof-Ext-debug.apk
            app/build/outputs/apk/release/PixelSpoof-Ext-release.apk
            app/build/outputs/apk/release/PixelSpoof-Ext-release-unsigned.apk
          draft: false
          prerelease: "${{ steps.tag_name.outputs.tag == 'latest' }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
